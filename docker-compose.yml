# ============================================================
# NovaCare v2.0 — Docker Compose (Local Development)
# Runs: TS Backend + Python Agents + Redis + PostgreSQL + LocalStack
# ============================================================

services:
  # ---- TypeScript Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://novacare:novacare_secret@postgres:5432/novacare_db
      - AGENT_SERVICE_URL=http://agents:8100
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    networks:
      - novacare-net

  # ---- Python Agent Service ----
  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    env_file:
      - ./agents/.env
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://novacare:novacare_secret@postgres:5432/novacare_db
      - DYNAMODB_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - BEDROCK_MODEL_ID=anthropic.claude-3-haiku-20240307-v1:0
      - BEDROCK_NOVA_MODEL_ID=amazon.nova-pro-v1:0
      - BEDROCK_GUARDRAIL_ID=rftxnd6f1m1e
      - BEDROCK_GUARDRAIL_VERSION=DRAFT
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - ./agents/novacare:/app/novacare
    networks:
      - novacare-net

  # ---- Frontend Dashboard (React + Vite) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - novacare-net
    depends_on:
      - backend

  # ---- Redis (Queue + Cache) ----
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - novacare-net

  # ---- PostgreSQL (Prisma + FHIR) ----
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: novacare
      POSTGRES_PASSWORD: novacare_secret
      POSTGRES_DB: novacare_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novacare -d novacare_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - novacare-net

  # ---- LocalStack (Mock AWS: DynamoDB, S3, SQS, EventBridge) ----
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,s3,sqs,events,secretsmanager
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - localstack-data:/var/lib/localstack
    networks:
      - novacare-net

  # ---- LocalStack Init (creates DynamoDB table on startup) ----
  localstack-init:
    image: amazon/aws-cli:latest
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: /bin/sh
    command: >
      -c "
      aws --endpoint-url=http://localstack:4566 dynamodb create-table
      --table-name novacare_patient_state
      --attribute-definitions
        AttributeName=pk,AttributeType=S
        AttributeName=sk,AttributeType=S
        AttributeName=hospital_id,AttributeType=S
        AttributeName=discharge_date,AttributeType=S
        AttributeName=risk_tier,AttributeType=S
        AttributeName=risk_score,AttributeType=N
        AttributeName=escalation_status,AttributeType=S
        AttributeName=escalation_created_at,AttributeType=S
      --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE
      --global-secondary-indexes
        '[{\"IndexName\":\"hospital_active_patients_index\",\"KeySchema\":[{\"AttributeName\":\"hospital_id\",\"KeyType\":\"HASH\"},{\"AttributeName\":\"discharge_date\",\"KeyType\":\"RANGE\"}],\"Projection\":{\"ProjectionType\":\"ALL\"}},{\"IndexName\":\"risk_score_index\",\"KeySchema\":[{\"AttributeName\":\"risk_tier\",\"KeyType\":\"HASH\"},{\"AttributeName\":\"risk_score\",\"KeyType\":\"RANGE\"}],\"Projection\":{\"ProjectionType\":\"ALL\"}},{\"IndexName\":\"escalation_pending_index\",\"KeySchema\":[{\"AttributeName\":\"escalation_status\",\"KeyType\":\"HASH\"},{\"AttributeName\":\"escalation_created_at\",\"KeyType\":\"RANGE\"}],\"Projection\":{\"ProjectionType\":\"ALL\"}}]'
      --billing-mode PAY_PER_REQUEST
      --region us-east-1 2>/dev/null || echo 'Table already exists'
      "
    networks:
      - novacare-net

volumes:
  redis-data:
  postgres-data:
  localstack-data:

networks:
  novacare-net:
    driver: bridge
